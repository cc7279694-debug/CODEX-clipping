<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="common.css"><title>03 作品</title>
<style>
h1 { font-size: 76px; }.phone { position: absolute; width: 510px; height: 870px; top: 800px; left: 285px; border: 12px solid #78958a; border-radius: 66px; background: #eef1e9; box-shadow: 0 55px 110px #050b0caa; color: #243c37; overflow: hidden; }

</style></head><body><main class="canvas"><div class="border"></div><div class="eyebrow">A FIRST CREATION</div>

<script>window.film={duration:4,frame(t){const x=Math.max(0,Math.min(1,t/0.9));document.querySelector('#copy').style.opacity=String(x);document.querySelector('#copy').style.transform=`translateY(${(1-x)*24}px)`;document.querySelector('#phone').style.transform=`translateY(${(1-x)*48}px) rotate(${(1-x)*-1.2}deg)`;}};</script></body></html>
