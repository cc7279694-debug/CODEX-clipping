<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="common.css"><title>01 起点</title>
<style>
.orb { position: absolute; width: 780px; height: 780px; left: 185px; top: 815px; border: 1px solid rgba(189,225,201,.23); border-radius: 50%; box-shadow: inset 0 0 100px rgba(83,139,124,.11), 0 0 120px rgba(83,139,124,.08); }
